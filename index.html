<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🔐 登录 - 个人主页</title>
    <style>
        body{
            margin:0;
            padding:0;
            background:#000022;
            color:#ffffff;
            font-family:"宋体",Verdana,sans-serif;
            overflow-x:hidden;
        }
        /* 闪烁星空 */
        .star{
            position:absolute;
            background:#fff;
            border-radius:50%;
            animation: blink 2s infinite alternate;
        }
        @keyframes blink{
            0%{opacity:0.2;}
            100%{opacity:1;}
        }
        /* 竖长长方形容器 */
        .container{
            width:320px;
            height:580px;
            margin:40px auto;
            border:4px ridge #ffcc00;
            background:#111144;
            padding:25px;
        }
        .title{
            text-align:center;
            font-size:26px;
            font-weight:bold;
            background:linear-gradient(90deg,red,#ff9900,yellow,lime,#00ccff,#9933ff);
            -webkit-background-clip:text;
            color:transparent;
            animation: flash 1s infinite;
        }
        @keyframes flash{
            0%,100%{opacity:1;}
            50%{opacity:0.7;}
        }
        .marquee-box{
            margin:15px 0;
            color:#ffff66;
        }
        .btn-area{
            text-align:center;
            margin-top:20px;
        }
        button{
            padding:8px 28px;
            font-size:18px;
            border:3px outset #cccccc;
            background:#dddddd;
            cursor:pointer;
        }
        button:active{
            border-style:inset;
        }
        /* 索引导航区 */
        .nav-index{
            margin-top:40px;
            border:2px inset #6699ff;
            padding:15px;
        }
        .nav-index h4{
            text-align:center;
            margin-top:0;
            color:#ffcc66;
        }
        .nav-index a{
            display:block;
            color:#00ffff;
            text-decoration:none;
            margin:12px 0;
            font-size:16px;
        }
        .nav-index a:hover{
            color:#ffff00;
            text-decoration:underline;
        }
        .link-back{
            text-align:center;
            margin-top:25px;
        }
        a{
            color:#00ffff;
        }
    </style>
</head>
<body>
<script>
//生成星空背景
for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.classList.add('star');
    s.style.width=Math.random()*3+'px';
    s.style.height=s.style.width;
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*2+'s';
    document.body.appendChild(s);
}
//直接跳转主页
function goHome(){
    alert("✅欢迎光临本站！");
    window.location.href="index.html";
}
</script>

<div class="container">
    <div class="title">🔐 进入主页</div>
    <div class="marquee-box">
        <marquee scrollamount="3">欢迎来到本站 · 点击按钮即可进入</marquee>
    </div>
    <div class="btn-area">
        <button onclick="goHome()">进 入 网 站</button>
    </div>

    <!-- 索引导航区域 -->
    <div class="nav-index">
        <h4>📋站点索引</h4>
        <a href="index.html">🏠 网站主页</a>
        <a href="photo.html">🖼️ 个人相册</a>
        <a href="guestbook.html">📝 留言板</a>
        <a href="about.html">👤 关于本站</a>
    </div>

    <div class="link-back">
        <a href="index.html">← 返回主页</a>
    </div>
</div>

</body>
</html>
